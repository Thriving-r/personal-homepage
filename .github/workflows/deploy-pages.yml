name: Publish personal homepage

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Supabase public client
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              "index.html": [
                  (
                      "// Supabase 配置 - 注意：在实际部署时请使用环境变量存储密钥",
                      "// Supabase 配置",
                  ),
                  (
                      "const SUPABASE_URL = 'https://your-project.supabase.co';",
                      "const SUPABASE_URL = 'https://taqpbdsevtrznhkgyunl.supabase.co';",
                  ),
                  (
                      "const SUPABASE_KEY = 'your-public-key';",
                      "const SUPABASE_KEY = 'sb_publishable_HsEycjdTPw04jdKUkP2a0w_ku8lZncC';",
                  ),
              ],
              "test-feedback.html": [
                  (
                      "// 配置 Supabase（请在测试前替换为你的实际配置）",
                      "// 配置 Supabase",
                  ),
                  (
                      "const SUPABASE_URL = 'https://your-project.supabase.co';",
                      "const SUPABASE_URL = 'https://taqpbdsevtrznhkgyunl.supabase.co';",
                  ),
                  (
                      "const SUPABASE_KEY = 'your-public-key';",
                      "const SUPABASE_KEY = 'sb_publishable_HsEycjdTPw04jdKUkP2a0w_ku8lZncC';",
                  ),
              ],
          }

          changed = []
          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              updated = text
              for old, new in pairs:
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding="utf-8")
                  changed.append(filename)

          Path(".pages-config-changed").write_text("\n".join(changed), encoding="utf-8")
          PY

      - name: Commit published configuration
        run: |
          if [ -s .pages-config-changed ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html test-feedback.html
            git commit -m "Configure Supabase public client"
            git push
          fi

      - name: Prepare static site
        run: |
          mkdir -p /tmp/site
          cp index.html bci.html calligraphy.html travel.html /tmp/site/
          cp -R assets /tmp/site/
          touch /tmp/site/.nojekyll

      - name: Publish to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan gh-pages
          git rm -rf .
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R /tmp/site/. .
          git add -A
          git commit -m "Deploy personal homepage"
          git push --force origin gh-pages
